name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tool versions
        shell: bash
        run: |
          bash --version | head -1
          git --version
          (pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' || powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()') 2>/dev/null || true
      - name: Adapters match core/
        run: python build.py --check
      - name: Tests (bash + PowerShell + parity, Jira, build, installer)
        shell: bash
        run: |
          # macOS: exercise the system bash 3.2 that most Mac users have.
          if [ "$RUNNER_OS" = "macOS" ]; then export ADLC_TEST_BASH=/bin/bash; fi
          git config --global user.email ci@example.com
          git config --global user.name CI
          python tests/ci_run.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR -S warning core/scripts/adlc core/scripts/lib.sh install.sh
      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          try {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          } catch {
            Write-Output "::error title=PSScriptAnalyzer install failed::$($_.Exception.Message)"
            exit 1
          }
          $failed = $false
          foreach ($file in @('core/scripts/adlc.ps1', 'install.ps1')) {
            # -Path takes a single file
            foreach ($i in @(Invoke-ScriptAnalyzer -Path $file -Severity Error)) {
              $failed = $true
              Write-Output "::error file=$file,line=$($i.Line),title=$($i.RuleName)::$($i.Message)"
            }
          }
          if ($failed) { exit 1 }
          'No PSScriptAnalyzer errors.'
